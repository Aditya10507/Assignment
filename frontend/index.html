<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udhi Science Diagram Maker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Science Diagram Maker</h1>
        <p>GCSE Lesson Diagrams - AI Generated</p>
    </header>

    <main>
        <table id="diagramTable">
            <thead>
                <tr>
                    <th>Concept</th>
                    <th>Diagram</th>
                    <th>Checks</th>
                    <th>Cost & Metrics</th>
                    <th>Reviewer Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows will be injected here by app.js -->
                <tr>
                    <td colspan="5" style="text-align: center;">Loading diagrams...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="app.js"></script>
</body>
</html>
